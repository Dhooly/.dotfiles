set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g history-limit 100000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g window-size smallest

setw -g mode-keys vi
set -g status-keys vi

bind r source-file ~/.tmux.conf \; display-message "tmux configuration reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind & kill-window
bind x kill-pane

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'dotfiles-copy'
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'dotfiles-copy'

# Preserve Ctrl-h/j/k/l across Neovim windows and tmux panes.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|l?n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n C-\\ if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

# Keep the useful plugins from the previous workstation configuration.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'pschmitt/tmux-ssh-split'
set -g @emulate-scroll-for-no-mouse-alternate-buffer 'on'
set -g @ssh-split-keep-cwd 'true'
set -g @ssh-split-h-key '%'
set -g @ssh-split-v-key '"'

set -g status-position bottom
set -g status-style "bg=#282828,fg=#ebdbb2"
set -g message-style "bg=#458588,fg=#fbf1c7"
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#83a598"

if-shell -b '[ -r ~/.tmux.conf.local ]' 'source-file ~/.tmux.conf.local'
if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' 'run-shell ~/.tmux/plugins/tpm/tpm'
